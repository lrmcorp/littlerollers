name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dailydose
          POSTGRES_PASSWORD: dailydose_ci
          POSTGRES_DB: dailydose_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dailydose -d dailydose_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://dailydose:dailydose_ci@localhost:5432/dailydose_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:validate
      - run: pnpm openapi:drift
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm check
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.38.5, channel: stable, cache: true }
      - run: flutter pub get
        working-directory: packages/api-client-dart
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: dart test
        working-directory: packages/api-client-dart
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
