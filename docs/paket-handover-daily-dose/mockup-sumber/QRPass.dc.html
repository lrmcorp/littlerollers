<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>QR Pass check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@500;600&display=swap">
<style>
body { margin: 0; font-family: "DM Sans", system-ui, sans-serif; }
button, a { font-family: inherit; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #24483a; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 8px 12px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Kembali ke beranda" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px; line-height: 26px; color: #ffffff">QR Pass</h1>
  </header>

  <div style="flex: 1; padding: 12px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px">

    <p style="margin: 0; font-size: 17px; line-height: 26px; color: #d8e5de; text-align: center">Tunjukkan layar ini ke staf saat tiba di studio</p>

    <div style="background: #ffffff; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; box-sizing: border-box">

      <div aria-label="Kode QR check-in" role="img" style="width: 230px; height: 230px; background: #ffffff; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: 3px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
          <span style="{{c.style}}"></span>
        </sc-for>
      </div>

      <div style="width: 100%; border-top: 1px solid #768b84; padding-top: 16px; display: flex; flex-direction: column; gap: 6px; text-align: center">
        <span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; line-height: 28px; color: #17231e">Private Group</span>
        <span style="font-size: 17px; line-height: 26px; color: #17231e">Selasa, 27 Okt 2026, 09.00 WIB</span>
        <span style="font-size: 16px; line-height: 24px; color: #607069">Daily Dose Muara Karang, instruktur Clara</span>
        <span style="font-size: 16px; line-height: 24px; color: #607069">Atas nama [nama member]</span>
      </div>

    </div>

    <div style="background: #2f5c4a; border-radius: 12px; padding: 14px 16px; width: 100%; box-sizing: border-box">
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #d8e5de">Layar otomatis dicerahkan supaya QR mudah dipindai. Kode berlaku 30 menit sebelum sampai 15 menit setelah kelas dimulai.</p>
    </div>

    <button type="button" style="width: 100%; min-height: 52px; background: #ffffff; color: #24483a; border: none; border-radius: 12px; font-size: 17px; font-weight: 500; cursor: pointer">Simpan ke galeri</button>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// The grid stands in for the real QR image. A fixed pattern keeps the mockup
// honest: it is a placeholder, not a scannable code.
class Component extends DCLogic {
  renderVals() {
    const filled = [
      0,1,2,6,7,8, 10,12,16,18, 20,21,22,24,26,27,28,
      30,34,35,39, 40,42,44,45,47,49, 51,53,55,58,
      60,61,63,66,68,69, 70,74,76,78, 80,81,82,84,86,88,
      90,92,93,95,97,99
    ];
    const set = {};
    filled.forEach((i) => { set[i] = true; });
    const cells = [];
    for (let i = 0; i < 100; i += 1) {
      cells.push({
        style: 'border-radius: 2px; background: ' + (set[i] ? '#17231e' : '#f3f6f4') + ';'
      });
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
