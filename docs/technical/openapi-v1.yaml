openapi: 3.1.0
info:
  title: Daily Dose API
  version: 1.15.0-draft
  description: Gate-4 contract baseline. Operations marked x-blocked-by cannot enter production until the decision is approved.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
x-standard-response-headers:
  X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
x-standard-response-policy: Every success response explicitly declares X-Correlation-ID; reusable error responses declare it through their component definition.
tags:
  - { name: Auth }
  - { name: Identity }
  - { name: Access }
  - { name: Master }
  - { name: Packages }
  - { name: Ledger }
  - { name: Classes }
  - { name: Bookings }
  - { name: Attendance }
  - { name: Finance }
  - { name: Notifications }
  - { name: Audit }
  - { name: Operations }
  - { name: Migration }

paths:
  /auth/google:
    post:
      tags: [Auth]
      security: []
      operationId: authenticateGoogle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleAuthRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/password/sessions:
    post:
      tags: [Auth]
      security: []
      operationId: authenticatePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSessionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /auth/password/activations:
    post:
      tags: [Auth]
      security: []
      operationId: activatePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordTokenCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/customer-registrations:
    post:
      tags: [Auth]
      security: []
      operationId: registerCustomer
      description: Creates an active CUSTOMER account with pending private selfie and KTP verification, then issues a web session.
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/CustomerRegistrationCommand' } } } }
      responses: { '201': { $ref: '#/components/responses/SessionResponse' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /auth/password/reset-requests:
    post:
      tags: [Auth]
      security: []
      operationId: requestPasswordReset
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses: { '202': { description: Generic acceptance without account enumeration, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptedStatus' } } } }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } }
  /auth/password/resets:
    post:
      tags: [Auth]
      security: []
      operationId: resetPassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordTokenCommand' } } } }
      responses: { '200': { description: Password changed and existing sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/ChangedStatus' } } } }, '410': { $ref: '#/components/responses/Gone' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/password/change:
    post:
      tags: [Auth]
      operationId: changePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChangeCommand' } } } }
      responses: { '200': { description: Password changed and other sessions revoked, content: { application/json: { schema: { $ref: '#/components/schemas/ChangedStatus' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/security:
    get:
      tags: [Auth]
      operationId: getAuthSecurityStatus
      responses: { '200': { description: Credential methods for the current user, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSecurityStatus' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/otp/requests:
    post:
      tags: [Auth]
      security: []
      operationId: requestOtp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses: { '202': { description: Request accepted regardless of account existence, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeAccepted' } } } }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Error' } }
  /auth/otp/verifications:
    post:
      tags: [Auth]
      security: []
      operationId: verifyOtp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      description: Mobile sends the rotating refresh token as Bearer credential; web uses its secure HttpOnly session cookie.
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses: { '204': { description: Session revoked, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } } } }
  /auth/sessions/revoke-all:
    post:
      tags: [Auth]
      operationId: revokeAllSessions
      x-blocked-by: DEC-012
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeSessionsCommand' } } } }
      responses: { '204': { description: All applicable session/token families revoked, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/recovery-requests:
    post:
      tags: [Auth]
      security: []
      operationId: requestAccountRecovery
      x-blocked-by: DEC-014
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequestCommand' } } } }
      responses: { '202': { description: Generic acceptance without account enumeration, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeAccepted' } } } }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Error' } }
  /auth/recoveries/{id}/verify:
    post:
      tags: [Auth]
      operationId: verifyAccountRecovery
      x-blocked-by: DEC-014
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryVerifyCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/account-links:
    post:
      tags: [Auth]
      operationId: linkVerifiedIdentity
      x-blocked-by: DEC-014
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountLinkCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses: { '200': { description: 'Current identity, session expiry, roles, active branch contexts and capabilities', headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '503': { $ref: '#/components/responses/Error' } }
  /me/profile:
    get: { tags: [Identity], operationId: getMyProfile, responses: { '200': { description: Masked account profile and preferred studio, content: { application/json: { schema: { $ref: '#/components/schemas/MyProfile' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } } }
    patch:
      tags: [Identity]
      operationId: updateMyProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMyProfileCommand' } } } }
      responses: { '200': { description: Updated account profile, content: { application/json: { schema: { $ref: '#/components/schemas/MyProfile' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /me/dashboard:
    get: { tags: [Dashboard], operationId: getMyDashboard, description: 'Customer-owned actionable overview.', responses: { '200': { description: Customer dashboard overview, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerDashboardOverview' } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /public/site-config:
    get: { tags: [Identity], operationId: getPublicSiteConfig, security: [], responses: { '200': { description: Active studios and public support routing, content: { application/json: { schema: { $ref: '#/components/schemas/PublicSiteConfig' } } } } } }
  /public/package-catalog:
    get:
      tags: [Packages]
      operationId: listPublicPackages
      security: []
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses: { '200': { description: Active public package catalog, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPackageCatalog' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /public/package-catalog/{id}:
    get:
      tags: [Packages]
      operationId: getPublicPackageDetail
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Active and currently effective package detail, content: { application/json: { schema: { $ref: '#/components/schemas/PublicPackageDetail' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /public/class-catalog:
    get:
      tags: [Classes]
      operationId: listPublicClassSchedule
      security: []
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/FromDateTime' }, { $ref: '#/components/parameters/UntilDateTime' } ]
      responses: { '200': { description: Published public class schedule, content: { application/json: { schema: { $ref: '#/components/schemas/PublicClassCatalog' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /public/class-catalog/{id}:
    get:
      tags: [Classes]
      operationId: getPublicScheduleDetail
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Published or confirmed schedule detail without instructor identity, content: { application/json: { schema: { $ref: '#/components/schemas/PublicScheduleDetail' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /public/class-types/{slug}:
    get:
      tags: [Classes]
      operationId: getPublicClassDetail
      security: []
      parameters: [ { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } } ]
      responses: { '200': { description: 'Public class profile with related studios, packages and schedules', content: { application/json: { schema: { $ref: '#/components/schemas/PublicClassDetail' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /public/studios/{slug}:
    get:
      tags: [Master]
      operationId: getPublicStudioDetail
      security: []
      parameters: [ { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } } ]
      responses: { '200': { description: Active public studio profile and related commercial content, content: { application/json: { schema: { $ref: '#/components/schemas/PublicStudioDetail' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /identity-verification/me:
    get: { tags: [Identity], operationId: getMyIdentityVerification, responses: { '200': { description: Customer verification summary, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationSummary' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /identity-verification/me/documents/{kind}/replacements:
    post:
      tags: [Identity]
      operationId: replaceMyIdentityDocument
      parameters: [ { name: kind, in: path, required: true, schema: { enum: [SELFIE, KTP_FRONT] } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, additionalProperties: false, required: [replacement, expectedVersion], properties: { replacement: { type: string, format: binary }, expectedVersion: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { description: Replacement document, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationDocument' } } } }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /identity-verification/me/documents/{kind}/view-authorizations:
    post: { tags: [Identity], operationId: authorizeMyIdentityDocumentView, parameters: [ { name: kind, in: path, required: true, schema: { enum: [SELFIE, KTP_FRONT] } } ], responses: { '200': { description: Short-lived single-use authorization for the customer-owned active document, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityDocumentSelfViewAuthorization' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
  /identity-verifications:
    get:
      tags: [Identity]
      operationId: listIdentityVerifications
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: customerUserId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: status, in: query, schema: { enum: [PENDING, APPROVED, REJECTED, PENDING_DELETION, DELETE_FAILED, DELETED] } }
        - { name: kind, in: query, schema: { enum: [SELFIE, KTP_FRONT] } }
        - { name: scanStatus, in: query, schema: { enum: [PENDING, CLEAN, REJECTED, INFECTED, ERROR] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Customer-grouped private identity verification review queue, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationReviewPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /identity-verifications/{id}/view-authorizations:
    post: { tags: [Identity], operationId: authorizeIdentityVerificationView, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Short-lived private view authorization, content: { application/json: { schema: { type: object, required: [url, expiresAt], properties: { url: { type: string }, expiresAt: { type: string, format: date-time } } } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /identity-verification-files/{authorizationId}/content:
    get:
      tags: [Identity]
      operationId: readAuthorizedIdentityVerificationFile
      description: Streams one private identity image through a short-lived, viewer-bound, single-use authorization. The viewer is either the owning customer or an authorized reviewer. The response is never cacheable.
      parameters: [ { name: authorizationId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } } ]
      responses:
        '200':
          description: Private identity image
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store, max-age=0' } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /identity-verifications/{id}/decisions/{decision}:
    post: { tags: [Identity], operationId: decideIdentityVerification, parameters: [ { $ref: '#/components/parameters/Id' }, { name: decision, in: path, required: true, schema: { enum: [approve, reject] } } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationDecisionCommand' } } } }, responses: { '200': { description: Decided document, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationDocument' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /identity-verifications/{id}/delete:
    post: { tags: [Identity], operationId: deleteIdentityVerificationFile, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedVersion, reason], properties: { expectedVersion: { type: integer, minimum: 0 }, reason: { type: string, minLength: 3, maxLength: 500 } } } } } }, responses: { '200': { description: Private document deletion result, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityVerificationDeletionResult' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /users:
    get: { tags: [Identity], operationId: listUsers, parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/BranchId' }, { name: search, in: query, schema: { type: string } }, { name: status, in: query, schema: { enum: [PENDING_ACTIVATION, ACTIVE, INACTIVE] } }, { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }, { name: audience, in: query, schema: { enum: [STAFF, CUSTOMER], default: STAFF } }, { name: verificationStatus, in: query, schema: { enum: [PENDING, ACTION_REQUIRED, APPROVED] } } ], responses: { '200': { $ref: '#/components/responses/UserPageResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } } }
    post:
      tags: [Identity]
      operationId: inviteUser
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, displayName, roleAssignments], properties: { email: { type: string, format: email }, displayName: { type: string, minLength: 2, maxLength: 120 }, roleAssignments: { type: array, minItems: 1, items: { $ref: '#/components/schemas/UserRoleInput' } }, roles: { type: array, deprecated: true, items: { $ref: '#/components/schemas/Role' } }, branchIds: { type: array, deprecated: true, items: { $ref: '#/components/schemas/Uuid' } } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '422': { $ref: '#/components/responses/Error' } }
  /lookups/users:
    get: { tags: [Identity], operationId: lookupUsers, description: 'Returns a minimal, branch-scoped user selector payload. Requires user:read or audit:read.', parameters: [ { name: q, in: query, schema: { type: string, maxLength: 120 } }, { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } } ], responses: { '200': { description: 'Scoped lookup page', content: { application/json: { schema: { $ref: '#/components/schemas/LookupPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /lookups/instructors:
    get: { tags: [Identity], operationId: lookupInstructors, description: 'Returns active instructors visible in the requested branch. Requires master:read or class-slot read/manage.', parameters: [ { name: q, in: query, schema: { type: string, maxLength: 120 } }, { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } } ], responses: { '200': { description: 'Scoped instructor lookup page', content: { application/json: { schema: { $ref: '#/components/schemas/LookupPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /users/role-catalog:
    get: { tags: [Identity], operationId: getRoleCatalog, description: 'Compatibility projection of active system roles from the database-managed catalog.', responses: { '200': { description: 'Application role and capability catalog', content: { application/json: { schema: { $ref: '#/components/schemas/RoleCatalog' } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /access/capabilities:
    get: { tags: [Access], operationId: listCapabilityDefinitions, parameters: [ { name: q, in: query, schema: { type: string } }, { name: category, in: query, schema: { type: string } }, { name: sensitive, in: query, schema: { type: boolean } }, { name: active, in: query, schema: { type: boolean } } ], responses: { '200': { description: 'Implementation-backed capability catalog', content: { application/json: { schema: { $ref: '#/components/schemas/CapabilityDefinitionPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
  /access/roles:
    get: { tags: [Access], operationId: listAccessRoles, parameters: [ { name: q, in: query, schema: { type: string } }, { name: scope, in: query, schema: { $ref: '#/components/schemas/AccessRoleScope' } }, { name: active, in: query, schema: { type: boolean } } ], responses: { '200': { description: 'Database-managed role catalog', content: { application/json: { schema: { $ref: '#/components/schemas/AccessRolePage' } } } }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Access], operationId: createAccessRole, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAccessRoleCommand' } } } }, responses: { '200': { description: 'Created custom role', content: { application/json: { schema: { $ref: '#/components/schemas/AccessRoleDefinition' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /access/roles/{id}:
    get: { tags: [Access], operationId: getAccessRole, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: 'Role definition and assigned capabilities', content: { application/json: { schema: { $ref: '#/components/schemas/AccessRoleDefinition' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { tags: [Access], operationId: updateAccessRole, parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAccessRoleCommand' } } } }, responses: { '200': { description: 'Updated role metadata; affected sessions revoked', content: { application/json: { schema: { $ref: '#/components/schemas/AccessRoleDefinition' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /access/roles/{id}/capabilities:
