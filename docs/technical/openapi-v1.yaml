openapi: 3.1.0
info:
  title: Daily Dose API
  version: 1.3.0-draft
  description: Gate-4 contract baseline. Operations marked x-blocked-by cannot enter production until the decision is approved.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
x-standard-response-headers:
  X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
x-standard-response-policy: Every success response explicitly declares X-Correlation-ID; reusable error responses declare it through their component definition.
tags:
  - { name: Auth }
  - { name: Identity }
  - { name: Master }
  - { name: Packages }
  - { name: Ledger }
  - { name: Classes }
  - { name: Bookings }
  - { name: Attendance }
  - { name: Finance }
  - { name: Notifications }
  - { name: Audit }
  - { name: Operations }
  - { name: Migration }

paths:
  /auth/google:
    post:
      tags: [Auth]
      security: []
      operationId: authenticateGoogle
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoogleAuthRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/otp/requests:
    post:
      tags: [Auth]
      security: []
      operationId: requestOtp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } } }
      responses: { '202': { description: Request accepted regardless of account existence, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeAccepted' } } } }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Error' } }
  /auth/otp/verifications:
    post:
      tags: [Auth]
      security: []
      operationId: verifyOtp
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      description: Mobile sends the rotating refresh token as Bearer credential; web uses its secure HttpOnly session cookie.
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses: { '204': { description: Session revoked, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } } } }
  /auth/sessions/revoke-all:
    post:
      tags: [Auth]
      operationId: revokeAllSessions
      x-blocked-by: DEC-012
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeSessionsCommand' } } } }
      responses: { '204': { description: All applicable session/token families revoked, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/mfa/challenges:
    post:
      tags: [Auth]
      operationId: createMfaChallenge
      x-blocked-by: DEC-012
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaChallengeCommand' } } } }
      responses: { '201': { description: Short-lived challenge without secret material, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MfaChallenge' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /auth/mfa/verifications:
    post:
      tags: [Auth]
      operationId: verifyMfaChallenge
      x-blocked-by: DEC-012
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerifyCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '410': { $ref: '#/components/responses/Gone' }, '429': { $ref: '#/components/responses/RateLimited' } }
  /auth/recovery-requests:
    post:
      tags: [Auth]
      security: []
      operationId: requestAccountRecovery
      x-blocked-by: DEC-014
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequestCommand' } } } }
      responses: { '202': { description: Generic acceptance without account enumeration, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeAccepted' } } } }, '422': { $ref: '#/components/responses/ValidationError' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Error' } }
  /auth/recoveries/{id}/verify:
    post:
      tags: [Auth]
      operationId: verifyAccountRecovery
      x-blocked-by: DEC-014
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryVerifyCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/SessionResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '410': { $ref: '#/components/responses/Gone' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /auth/account-links:
    post:
      tags: [Auth]
      operationId: linkVerifiedIdentity
      x-blocked-by: DEC-014
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountLinkCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses: { '200': { description: 'Current identity, roles, branch assignments and capabilities', headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } }
  /users:
    get: { tags: [Identity], operationId: listUsers, parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/BranchId' } ], responses: { '200': { $ref: '#/components/responses/Page' } } }
    post:
      tags: [Identity]
      operationId: inviteUser
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, roles], properties: { email: { type: string, format: email }, roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, branchIds: { type: array, items: { $ref: '#/components/schemas/Uuid' } } } } } } }
      responses: { '201': { $ref: '#/components/responses/Resource' }, '422': { $ref: '#/components/responses/Error' } }
  /users/{id}/deactivate:
    post: { tags: [Identity], operationId: deactivateUser, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { $ref: '#/components/requestBodies/ReasonCommand' }, responses: { '200': { $ref: '#/components/responses/Resource' }, '409': { $ref: '#/components/responses/Error' } } }
  /assignments:
    get: { tags: [Identity], operationId: listAssignments, description: 'Returns assignment intervals visible to the authenticated actor. Foreign branch scope is hidden as RESOURCE_NOT_FOUND.', parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { $ref: '#/components/responses/AssignmentPageResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
    post: { tags: [Identity], operationId: createAssignment, description: 'Creates an OWNER or INSTRUCTOR interval and linked role projection atomically. Requires assignment:manage and MFA.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /assignments/{id}/end:
    post:
      tags: [Identity]
      operationId: endAssignment
      description: 'Ends the half-open assignment at the start of the branch-local calendar date containing effectiveAt. Requires MFA and expectedVersion.'
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EndAssignmentCommand' } } } }
      responses: { '200': { $ref: '#/components/responses/Resource' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } }
  /branches:
    get: { tags: [Master], operationId: listBranches, responses: { '200': { $ref: '#/components/responses/BranchPageResponse' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Master], operationId: createBranch, description: 'Creates an active branch. Requires master:manage and MFA.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchCommand' } } } }, responses: { '201': { $ref: '#/components/responses/BranchResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /branches/{id}/deactivate:
    post: { tags: [Master], operationId: deactivateBranch, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCommand' } } } }, responses: { '200': { $ref: '#/components/responses/BranchResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /class-types:
    get: { tags: [Master], operationId: listClassTypes, parameters: [ { $ref: '#/components/parameters/BranchId' } ], responses: { '200': { $ref: '#/components/responses/ClassTypePageResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
    post: { tags: [Master], operationId: createClassType, description: 'Creates an active class type in one visible branch. Requires master:manage and MFA.', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClassTypeCommand' } } } }, responses: { '201': { $ref: '#/components/responses/ClassTypeResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /class-types/{id}/deactivate:
    post: { tags: [Master], operationId: deactivateClassType, parameters: [ { $ref: '#/components/parameters/Id' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionCommand' } } } }, responses: { '200': { $ref: '#/components/responses/ClassTypeResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /master-settings/{kind}:
    get: { tags: [Master], operationId: listEffectiveSettings, parameters: [ { name: kind, in: path, required: true, schema: { enum: [instructor-fees, projection-rates, quota-capacity] } }, { $ref: '#/components/parameters/BranchId' } ], responses: { '200': { $ref: '#/components/responses/Page' } } }
    post: { tags: [Master], operationId: createEffectiveSetting, parameters: [ { name: kind, in: path, required: true, schema: { enum: [instructor-fees, projection-rates, quota-capacity] } } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EffectiveSettingCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' }, '409': { $ref: '#/components/responses/Error' } } }
  /instructor-fees:
    get: { tags: [Master], operationId: listInstructorFees, parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { $ref: '#/components/responses/EffectiveSettingPageResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Master], operationId: createInstructorFee, x-blocked-by: DEC-006, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InstructorFeeCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /projection-rates:
    get: { tags: [Master], operationId: listProjectionRates, parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { $ref: '#/components/responses/EffectiveSettingPageResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Master], operationId: createProjectionRate, x-blocked-by: DEC-006, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionRateCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /quota-capacity-settings:
    get: { tags: [Master], operationId: listQuotaCapacitySettings, parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { $ref: '#/components/responses/EffectiveSettingPageResponse' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { tags: [Master], operationId: createQuotaCapacitySetting, x-blocked-by: DEC-005, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuotaCapacityCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /packages:
    get: { tags: [Packages], operationId: listPackages, description: 'Returns ACTIVE packages effective for the requested scoped branch. Commercial periods are half-open [effectiveFrom,effectiveUntil).', parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { description: Scoped package page, content: { application/json: { schema: { $ref: '#/components/schemas/PackagePage' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
    post: { tags: [Packages], operationId: createPackage, x-blocked-by: DEC-004, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageCommand' } } } }, responses: { '201': { $ref: '#/components/responses/Resource' } } }
  /purchases:
    get: { tags: [Packages], operationId: listPurchases, parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Status' } ], responses: { '200': { description: Scoped purchase page, content: { application/json: { schema: { $ref: '#/components/schemas/PurchasePage' } } } } } }
    post: { tags: [Packages], operationId: submitPurchase, parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [packageId, paymentProofUploadId], properties: { packageId: { $ref: '#/components/schemas/Uuid' }, customerUserId: { $ref: '#/components/schemas/Uuid' }, paymentProofUploadId: { $ref: '#/components/schemas/Uuid' } } } } } }, responses: { '201': { description: Submitted purchase, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /uploads/payment-proofs:
    post: { tags: [Packages], operationId: createPaymentProofUpload, description: 'Issues an opaque private upload reference after metadata validation. Production remains CONFIGURATION_REQUIRED until storage and scan providers are approved.', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [branchId, fileName, mimeType, sizeBytes, sha256], properties: { branchId: { $ref: '#/components/schemas/Uuid' }, packageId: { $ref: '#/components/schemas/Uuid' }, fileName: { type: string, maxLength: 160 }, mimeType: { type: string }, sizeBytes: { type: integer, minimum: 1 }, sha256: { type: string, minLength: 64, maxLength: 64 } } } } } }, responses: { '201': { description: Short-lived opaque upload instruction; signed URL is never persisted or logged, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentProofUploadInstruction' } } } }, '422': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /uploads/payment-proofs/{id}/finalize:
    post: { tags: [Packages], operationId: finalizePaymentProofUpload, parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinalizeUploadCommand' } } } }, responses: { '202': { description: Scan queued, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentProof' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /uploads/payment-proofs/{id}:
    get: { tags: [Packages], operationId: getPaymentProofStatus, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Authorized upload/scan status, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentProof' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /uploads/payment-proofs/{id}/download-authorizations:
    post: { tags: [Packages], operationId: authorizePaymentProofDownload, parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '201': { description: Short-lived authorized download instruction for CLEAN proof, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/DownloadAuthorization' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /purchases/{id}/payment-proof-replacements:
    post: { tags: [Packages], operationId: replacePurchasePaymentProof, parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplacePaymentProofCommand' } } } }, responses: { '202': { $ref: '#/components/responses/Resource' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /purchases/{id}/approve:
    post: { tags: [Packages], operationId: approvePurchase, description: 'MFA-gated atomic decision. Activation is the approval date in branch timezone; expiry is exclusive at the start of activationDate + durationDays.', parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { $ref: '#/components/requestBodies/PurchaseDecisionCommand' }, responses: { '200': { description: Atomic approval result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalResult' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /purchases/{id}/reject:
    post: { tags: [Packages], operationId: rejectPurchase, description: 'MFA-gated rejection. Creates no customer package or ledger entry.', parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ], requestBody: { $ref: '#/components/requestBodies/PurchaseDecisionCommand' }, responses: { '200': { description: Rejected purchase, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' } } }
  /customer-packages:
    get: { tags: [Ledger], operationId: listCustomerPackages, description: 'Customer-own or branch-scoped balances from an authoritative ledger/reservation snapshot. Invalid cursor is rejected; invariant mismatch is never silently clamped.', parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { description: Scoped package balances, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPackageBalancePage' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /customer-packages/{id}/ledger:
    get: { tags: [Ledger], operationId: getPackageLedger, description: 'Append-only entries ordered by occurredAt and id descending with opaque keyset cursor and active reservation summary.', parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { description: Package balance and ledger page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/PackageLedgerResult' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '422': { $ref: '#/components/responses/ValidationError' }, '503': { $ref: '#/components/responses/ServiceUnavailable' } } }
  /session-adjustments:
    get: { tags: [Ledger], operationId: listSessionAdjustments, description: 'Branch-scoped adjustment queue ordered by createdAt and id descending.', parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Status' }, { $ref: '#/components/parameters/Cursor' } ], responses: { '200': { description: Typed adjustment page, content: { application/json: { schema: { $ref: '#/components/schemas/SessionAdjustmentPage' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/ValidationError' } } }
