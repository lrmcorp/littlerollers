components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: opaque-or-JWT-access-token }
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    BranchId: { name: branchId, in: query, schema: { $ref: '#/components/schemas/Uuid' }, description: Filter only; never grants authority }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    FromDateTime: { name: from, in: query, schema: { type: string, format: date-time }, description: Inclusive UTC-normalized window start; offset or Z required }
    UntilDateTime: { name: until, in: query, schema: { type: string, format: date-time }, description: Exclusive UTC-normalized window end; offset or Z required }
    Status: { name: status, in: query, schema: { type: string, maxLength: 40 } }
    Period: { name: period, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
  headers:
    CorrelationId: { description: End-to-end support correlation identifier, schema: { type: string, minLength: 1, maxLength: 128 } }
  requestBodies:
    PurchaseDecisionCommand: { required: true, content: { application/json: { schema: { type: object, required: [reasonCode, expectedVersion], properties: { reasonCode: { enum: [PAYMENT_VERIFIED, PROOF_INVALID, AMOUNT_MISMATCH, DUPLICATE_PURCHASE, OTHER_REVIEW_REQUIRED] }, expectedVersion: { type: integer, minimum: 0 } } } } } }
    ReasonCommand: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
  responses:
    Error: { description: Stable error envelope, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } }, application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    BadRequest: { $ref: '#/components/responses/Error' }
    Unauthorized: { $ref: '#/components/responses/Error' }
    Forbidden: { $ref: '#/components/responses/Error' }
    NotFound: { $ref: '#/components/responses/Error' }
    Conflict: { $ref: '#/components/responses/Error' }
    Gone: { $ref: '#/components/responses/Error' }
    ValidationError: { $ref: '#/components/responses/Error' }
    Locked: { $ref: '#/components/responses/Error' }
    RateLimited: { $ref: '#/components/responses/Error' }
    ServerError: { $ref: '#/components/responses/Error' }
    ServiceUnavailable: { $ref: '#/components/responses/Error' }
    Page: { description: Cursor page scoped by authorization, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
    AssignmentPageResponse: { description: Scoped assignment page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentPage' } } } }
    BranchResponse: { description: Branch state, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
    BranchPageResponse: { description: Scoped branch page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BranchPage' } } } }
    ClassTypeResponse: { description: Class type state, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassType' } } } }
    ClassTypePageResponse: { description: Scoped class type page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassTypePage' } } } }
    EffectiveSettingPageResponse: { description: Effective setting page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/EffectiveSettingPage' } } } }
    Resource: { description: Resource/result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
    SessionResponse: { description: Authenticated session, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    AvailabilityResponse: { description: Instructor availability, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
    AvailabilityPageResponse: { description: Scoped availability page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityPage' } } } }
    ClassSlotResponse: { description: Class slot state, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassSlot' } } } }
    ClassSlotPageResponse: { description: Scoped class-slot page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ClassSlotPage' } } } }
    BookingResponse: { description: Booking and reservation result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
    BookingPageResponse: { description: Scoped booking page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BookingPage' } } } }
    RescheduleResponse: { description: Reschedule request, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Reschedule' } } } }
    RescheduleDecisionResponse: { description: Atomic reschedule decision, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RescheduleDecisionResult' } } } }
    CheckInResponse: { description: Purpose-bound check-in result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInResult' } } } }
    FinancialReportPageResponse: { description: Reconciliable financial report, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialReportPage' } } } }
    OtherCostResponse: { description: Other cost record, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OtherCost' } } } }
    OtherCostPageResponse: { description: Other-cost page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OtherCostPage' } } } }
    BranchPeriodPageResponse: { description: Branch-period page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/BranchPeriodPage' } } } }
    CloseResultResponse: { description: Immutable monthly-close result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CloseResult' } } } }
    CorrectionResponse: { description: Correction request, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } } }
    CorrectionDecisionResponse: { description: Correction decision result, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectionDecisionResult' } } } }
    NotificationOccurrencePageResponse: { description: Notification occurrence page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationOccurrencePage' } } } }
    NotificationAttemptResponse: { description: Notification delivery attempt, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationAttempt' } } } }
    AuditLogPageResponse: { description: 'Masked, scoped audit page', headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogPage' } } } }
    OperationalJobPageResponse: { description: Operational job page, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OperationalJobPage' } } } }
    HealthResponse: { description: Sanitized dependency readiness, headers: { X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/HealthResult' } } } }
  schemas:
    Uuid: { type: string, format: uuid }
    Role: { type: string, enum: [CUSTOMER, INSTRUCTOR, ADMIN, MANAGER, OWNER, SUPER_OWNER, FINANCE, OPS] }
    Resource: { type: object, required: [id, status], properties: { id: { $ref: '#/components/schemas/Uuid' }, status: { type: string }, version: { type: integer }, attributes: { type: object, additionalProperties: true } } }
    Page: { type: object, required: [items, page], properties: { items: { type: array, items: { $ref: '#/components/schemas/Resource' } }, page: { type: object, required: [hasMore], properties: { nextCursor: { type: [string, 'null'] }, hasMore: { type: boolean } } } } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId, details]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  code: { type: string }
                  message: { type: string }
            retryable: { type: boolean, default: false }
    GoogleAuthRequest: { type: object, required: [idToken, nonce, channel], properties: { idToken: { type: string }, nonce: { type: string }, channel: { enum: [WEB, MOBILE] } } }
    OtpRequest: { type: object, required: [phoneE164], properties: { phoneE164: { type: string, pattern: '^\\+[1-9]\\d{7,14}$' } } }
    OtpVerifyRequest: { type: object, required: [requestId, code], properties: { requestId: { $ref: '#/components/schemas/Uuid' }, code: { type: string, minLength: 4, maxLength: 8 } } }
    ChallengeAccepted: { type: object, required: [requestId, expiresAt], properties: { requestId: { $ref: '#/components/schemas/Uuid' }, expiresAt: { type: string, format: date-time } } }
    RevokeSessionsCommand: { type: object, required: [reason], properties: { exceptCurrent: { type: boolean, default: false }, reason: { type: string, minLength: 3, maxLength: 300 } } }
    MfaChallengeCommand: { type: object, required: [purpose], properties: { purpose: { enum: [SIGN_IN, STEP_UP, ENROLLMENT, RECOVERY] }, method: { type: string, description: DEC-012 provider/method discriminator } } }
