name: dailydose-v2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

x-app: &app
  image: dailydose-v2-app:${APP_VERSION:-dev}
  build:
    context: .
    args:
      API_BASE_URL: ${API_BASE_URL:-http://api:32121}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
  env_file: ${APP_ENV_FILE:-.env.production}
  restart: unless-stopped
  networks: [dailydose]
  logging: *default-logging

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Port is not published to 0.0.0.0 to prevent collisions and internet exposure.
    # If host access is strictly required for maintenance or SSH tunneling, bind to localhost only:
    # ports:
    #   - '127.0.0.1:3315:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dailydose}
      MYSQL_USER: ${MYSQL_USER:-dailydose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=259200
      - --max-binlog-size=100M
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} 2>&1 | grep -v "Warning" || exit 0']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [dailydose]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [dailydose]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', '/usr/local/bin/clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [dailydose]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1200M

  migrate:
    <<: *app
    restart: 'no'
    command:
      [
        'node',
        'apps/api/node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'apps/api/prisma/schema.prisma',
      ]
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  private-storage-init:
    <<: *app
    user: '0:0'
    restart: 'no'
    command: ['sh', '-c', 'install -d -o 1001 -g 1001 -m 0700 /app/data/private']
    volumes:
      - private-uploads:/app/data/private
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    <<: *app
    networks:
      - dailydose
    command: ['node', 'apps/api/dist/main.js']
    volumes:
      - private-uploads:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      private-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const socket=require('node:net').connect(32121,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

  worker:
    <<: *app
    command: ['node', 'apps/worker/dist/main.js']
    volumes:
      - private-uploads:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      private-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ['node', '.next/standalone/apps/web/server.js']
    environment:
      PORT: 32120
      HOSTNAME: 0.0.0.0
    networks: [dailydose, dailydose-proxy]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('node:fs');const root='/app/apps/web/.next/standalone/apps/web';if(!fs.existsSync(root+'/.next/static')||!fs.existsSync(root+'/public'))process.exit(1);fetch('http://127.0.0.1:32120/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  mysql-data:
  redis-data:
  clamav-data:
  private-uploads:

networks:
  dailydose:
    driver: bridge
  dailydose-proxy:
    name: dailydose-v2-proxy
    external: true

