name: dailydose-v2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.production}
    ports:
      - '3315:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dailydose}
      MYSQL_USER: ${MYSQL_USER:-dailydose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=259200
      - --max-binlog-size=100M
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} 2>&1 | grep -v "Warning" || exit 0']
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [dailydose]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  app:
    # Image dibangun GitHub Actions dan ditarik dari GHCR oleh `update.sh --pull`; tag lokal `production` menunjuk
    # versi yang sedang berjalan. `docker compose build app` (update.sh tanpa argumen) tetap bisa dipakai sebagai cadangan.
    image: ${DD_APP_IMAGE:-ghcr.io/ridho15/dailydose-v2-app:production}
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:32121}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    env_file: ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    ports:
      - '32120:32120'
    environment:
      PORT: 32120
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://127.0.0.1:32121
      PAYMENT_PROOF_SCAN_DRIVER: synthetic
      PUBLIC_UPLOAD_ROOT: /app/data/public-uploads
    volumes:
      - private-uploads:/app/data/private
      - public-uploads:/app/data/public-uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dailydose
      - dailydose-proxy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:32120/ >/dev/null 2>&1 && wget -q -O - http://127.0.0.1:32121/api/v1/public/site-config >/dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          memory: 384M

volumes:
  mysql-data:
  private-uploads:
  public-uploads:

networks:
  dailydose:
    driver: bridge
  dailydose-proxy:
    name: dailydose-v2-proxy
    external: true


