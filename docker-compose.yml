name: dailydose-v2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Port is not published to 0.0.0.0 to prevent collisions and internet exposure.
    # If host access is strictly required for maintenance or SSH tunneling, bind to localhost only:
    # ports:
    #   - '127.0.0.1:3315:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dailydose}
      MYSQL_USER: ${MYSQL_USER:-dailydose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=259200
      - --max-binlog-size=100M
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} 2>&1 | grep -v "Warning" || exit 0']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [dailydose]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1024M

  app:
    image: dailydose-v2-app:${APP_VERSION:-dev}
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:32121}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    env_file: ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    environment:
      PORT: 32120
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://127.0.0.1:32121
      PAYMENT_PROOF_SCAN_DRIVER: synthetic
    volumes:
      - private-uploads:/app/data/private
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dailydose
      - dailydose-proxy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:32120/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  mysql-data:
  private-uploads:

networks:
  dailydose:
    driver: bridge
  dailydose-proxy:
    name: dailydose-v2-proxy
    external: true


