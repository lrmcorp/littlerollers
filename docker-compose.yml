name: dailydose-v2

x-app: &app
  image: dailydose-v2-app:${APP_VERSION:-dev}
  build:
    context: .
    args:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
  env_file: ${APP_ENV_FILE:-.env.production}
  restart: unless-stopped
  networks: [dailydose]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  mysql:
    image: mysql:8.4
    env_file: ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [dailydose]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [dailydose]

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [dailydose]

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "apps/api/node_modules/prisma/build/index.js", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    volumes:
      - private-uploads:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const socket=require('node:net').connect(32121,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('timeout',()=>{socket.destroy();process.exit(1)});socket.once('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    volumes:
      - private-uploads:/app/data/private
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  web:
    <<: *app
    command: ["pnpm", "--filter", "@dailydose/web", "exec", "next", "start", "-p", "32120"]
    networks: [dailydose, dailydose-proxy]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:32120/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  clamav-data:
  private-uploads:

networks:
  dailydose:
    driver: bridge
  dailydose-proxy:
    name: dailydose-v2-proxy
    external: true
