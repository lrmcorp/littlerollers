services:
  mysql:
    image: mysql:8.4
    command:
      - mysqld
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: dailydose_local
      MYSQL_USER: dailydose
      MYSQL_PASSWORD: dailydose_local
      MYSQL_ROOT_PASSWORD: dailydose_root_local
    # Docker is optional. Port 3307 avoids the native MySQL port used by npm run dev.
    ports: ['3307:3306']
    healthcheck:
      {
        test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u dailydose -pdailydose_local'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    volumes: ['mysql-data:/var/lib/mysql']
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
    volumes: ['redis-data:/data']
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: dailydose_local, MINIO_ROOT_PASSWORD: dailydose_local_only }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes: { mysql-data: {}, redis-data: {}, minio-data: {} }
