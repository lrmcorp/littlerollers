services:
  postgres:
    image: postgres:17-alpine
    environment:
      { POSTGRES_USER: dailydose, POSTGRES_PASSWORD: dailydose_local, POSTGRES_DB: dailydose }
    # Avoid the default host port because local developer PostgreSQL commonly owns 5432.
    ports: ['55432:5432']
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U dailydose'], interval: 5s, timeout: 3s, retries: 20 }
    volumes: ['postgres-data:/var/lib/postgresql/data']
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 3s, retries: 20 }
    volumes: ['redis-data:/data']
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: dailydose_local, MINIO_ROOT_PASSWORD: dailydose_local_only }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes: { postgres-data: {}, redis-data: {}, minio-data: {} }
