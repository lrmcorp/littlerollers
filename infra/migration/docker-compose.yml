services:
  migration-source:
    image: mysql:8.4
    command:
      - mysqld
      - --server-id=8411
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: dailydose_v1_fixture
      MYSQL_ROOT_PASSWORD: synthetic_root_source
    ports:
      - '${MIGRATION_SOURCE_PORT:-3317}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -psynthetic_root_source']
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - migration-source-data:/var/lib/mysql
      - '${MIGRATION_PRIVATE_ROOT:-../../.migration-integration/manual/private}:/shared-private'

  migration-target:
    image: mysql:8.4
    command:
      - mysqld
      - --server-id=8422
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: dailydose_v2_fixture
      MYSQL_USER: migration_target
      MYSQL_PASSWORD: synthetic_target
      MYSQL_ROOT_PASSWORD: synthetic_root_target
    ports:
      - '${MIGRATION_TARGET_PORT:-3318}:3306'
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -umigration_target -psynthetic_target']
      interval: 2s
      timeout: 3s
      retries: 60
    volumes:
      - migration-target-data:/var/lib/mysql
      - '${MIGRATION_PRIVATE_ROOT:-../../.migration-integration/manual/private}:/shared-private'

volumes:
  migration-source-data:
  migration-target-data:
